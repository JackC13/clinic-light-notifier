name = "clinic-light-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 每分鐘檢查一次到期的追蹤
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "clinic-light"
database_id = "814d947c-4490-416d-8457-fccad3c51733"

[vars]
# 允許下指令的聊天室（群組 C… / 個人 U…），逗號分隔
ALLOWED_CHAT_IDS = "C1e23fee597d0a7a4bc4d0a514ddfa46f,U6bd4189c693945ecf81247047cfcf17f"
# 用醫師名搜尋時，沒指定院區就查這些院區（CH 兒童醫院、T0 總院）
SEARCH_HOSPITALS = "CH,T0"
# 剩幾號時通知
THRESHOLDS = "10,5,2"
# 最長追蹤時數，逾時自動移除
MAX_HOURS = "8"

# 機密用 wrangler secret put 設定，不要寫在這裡：
#   LINE_CHANNEL_ACCESS_TOKEN
#   LINE_CHANNEL_SECRET
